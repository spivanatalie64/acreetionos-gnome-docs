site_name: AcreetionOS GNOME (Horizon) Docs
site_description: >-
  Documentation for AcreetionOS Horizon — the Arch Linux based community edition
  with a native X11 GNOME 48 + XLibre desktop and image-based updates via Freeman.
site_author: AcreetionOS
site_url: https://acreetionos-gnome.readthedocs.io/

repo_name: spivanatalie64/acreetionos-gnome-docs
repo_url: https://github.com/spivanatalie64/acreetionos-gnome-docs
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 AcreetionOS

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Overview: overview.md
  - Architecture & Build Internals: architecture.md
  - Building the ISO: building.md
  - Freeman: freeman.md
  - Image-Based Updates: image-updates.md
  - Applications & App Hub: applications.md
  - Calamares Installer: installer.md
  - Recovery & Snapshots: recovery.md
  - FAQ: faq.md

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.acreetionos.org
      name: AcreetionOS GitLab
